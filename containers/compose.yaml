services:
  db:
    image: docker.io/library/postgres:17-bookworm
    container_name: trago-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trago
      POSTGRES_PASSWORD: tragopassword
      POSTGRES_DB: trago
    ports:
      - "5432:5432"
    volumes:
      - trago_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trago -d trago"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: containers/Containerfile.backend
    container_name: trago-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://trago:tragopassword@db:5432/trago
      NODE_ENV: development
      TRAGO_DEMO_AUTH: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 bytes}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-900}
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  trago_db_data:
