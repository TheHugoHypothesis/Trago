name: Trago CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend API & PostgreSQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: trago
          POSTGRES_PASSWORD: tragopassword
          POSTGRES_DB: trago
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript & Run Integration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trago:tragopassword@localhost:5432/trago
        run: npm run check

  flutter-ci:
    name: Flutter Mobile Analyze, Test & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test

      - name: Build Release Android APK
        working-directory: mobile
        env:
          TRAGO_API_BASE_URL: ${{ vars.TRAGO_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TRAGO_API_BASE_URL}" ]; then
            echo "TRAGO_API_BASE_URL is not configured; building the standalone demo release."
            flutter build apk --release --dart-define=TRAGO_DEMO_MODE=true
          elif [[ "${TRAGO_API_BASE_URL}" == https://* ]]; then
            flutter build apk --release --dart-define=API_BASE_URL="${TRAGO_API_BASE_URL}"
          else
            echo "TRAGO_API_BASE_URL must use HTTPS for a release build." >&2
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/trago-android-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trago-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/trago-android-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release-apk:
    name: Publish Android APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: [backend-ci, flutter-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: trago-release-apk
          path: release-apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Trago Android Release (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }})"
          body: |
            ## Trago — aplicativo Android

            Este release contém o APK Android validado pelo pipeline do projeto.

            - Sem `TRAGO_API_BASE_URL`, o APK abre no modo demonstração isolado.
            - Com `TRAGO_API_BASE_URL` HTTPS, o APK usa cadastro, login e dados reais da API.
            - Aceitar uma solicitação reserva capacidade, mas não representa pagamento ou custódia financeira.
          files: |
            release-apk/trago-android-release.apk
            release-apk/app-release.apk
          draft: false
          prerelease: false

  container-cd:
    name: Container Image Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, flutter-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Container Image
        run: docker build -t trago-backend:${{ github.sha }} -f containers/Containerfile.backend .
