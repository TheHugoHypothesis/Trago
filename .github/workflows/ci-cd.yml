name: Trago CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-ci:
    name: Backend API & PostgreSQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: trago
          POSTGRES_PASSWORD: tragopassword
          POSTGRES_DB: trago
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript & Run Integration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trago:tragopassword@localhost:5432/trago
        run: npm run check

  flutter-ci:
    name: Flutter Mobile Analyze, Test, APK Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test

      - name: Build Release Android APK
        working-directory: mobile
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/trago-android-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trago-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/trago-android-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Android APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Trago Android Release (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }})"
          body: |
            ## Trago — Aplicativo Android (APK Release)

            ### Destaques da Versão
            - **Interface Mobile Completa em Flutter** fiel à identidade visual (`Design.png`).
            - **Mapa Interativo de Rotas Aéreas (`flutter_map` + `latlong2`)**: arcos geodésicos, distância em km e marcadores interativos entre hubs internacionais (`JFK`, `MIA`, `LHR`, `HND`, `CDG`) e aeroportos brasileiros (`GRU`, `GIG`, `CWB`).
            - **APIs Públicas em Tempo Real**:
              - Cotações comerciais `USD/BRL`, `EUR/BRL` e `GBP/BRL` via ExchangeRate Open API.
              - Clima ao vivo nos aeroportos de origem e destino via Open-Meteo API.
            - **Simulador Fiscal PF & PJ**: cálculo automático de isenção de bagagem acompanhada (US$ 1.000) vs. importação empresarial P2B (II + ICMS), com geração de **QR Code PIX** (`qr_flutter`) e compartilhamento (`share_plus`).
            - **Catálogo de Produtos e Viajantes Verificados** com fotografias reais integradas.
          files: |
            mobile/build/app/outputs/flutter-apk/trago-android-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

  container-cd:
    name: Container Image Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, flutter-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Container Image
        run: docker build -t trago-backend:${{ github.sha }} -f containers/Containerfile.backend .
