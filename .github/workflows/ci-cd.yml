name: Trago CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend API & PostgreSQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: trago
          POSTGRES_PASSWORD: tragopassword
          POSTGRES_DB: trago
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript & Run Integration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trago:tragopassword@localhost:5432/trago
        run: npm run check

  flutter-ci:
    name: Flutter Mobile Analyze, Test & APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile
        run: flutter test

      - name: Build Release Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trago-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  container-cd:
    name: Container Image Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, flutter-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Container Image
        run: docker build -t trago-backend:${{ github.sha }} -f containers/Containerfile.backend .
